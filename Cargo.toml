[package]
name = "modrinth-sync"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
ssh2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
dirs = "6"
walkdir = "2"
indicatif = "0.17"
log = "0.4"
env_logger = "0.11"
chrono = { version = "0.4", features = ["serde"] }
hostname = "0.4"
rpassword = "7"
anyhow = "1"
hex = "0.4"
